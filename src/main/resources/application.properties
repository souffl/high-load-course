server.address=0.0.0.0
server.port=8081
server.http2.enabled=true
spring.main.allow-bean-definition-overriding=true

# MongoDB properties
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=online-shop

# Tiny event sourcing library properties
event.sourcing.auto-scan-enabled=true
event.sourcing.scan-package=ru.quipy
event.sourcing.snapshots-enabled=false
event.sourcing.sagas-enabled=false

# Postgres event store properties
spring.datasource.hikari.jdbc-url=jdbc:postgresql://${POSTGRES_ADDRESS:localhost}:${POSTGRES_PORT:65432}/postgres
spring.datasource.hikari.username=tiny_es
spring.datasource.hikari.password=tiny_es
spring.datasource.hikari.leak-detection-threshold=2000

management.metrics.web.server.request.autotime.percentiles=0.95
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=info,health,prometheus,metrics

payment.service-name=${PAYMENT_SERVICE_NAME}
payment.token=${PAYMENT_TOKEN}
payment.accounts=${PAYMENT_ACCOUNTS:acc-7}
payment.hostPort=${PAYMENT_HOST:localhost}:${PAYMENT_PORT:1234}

payment.deadline-safety-margin-millis=${PAYMENT_DEADLINE_SAFETY_MARGIN_MILLIS:200}
payment.queue.deadline-admission-enabled=${PAYMENT_QUEUE_DEADLINE_ADMISSION_ENABLED:true}
payment.queue.deadline-admission-processing-budget-millis=${PAYMENT_QUEUE_DEADLINE_ADMISSION_PROCESSING_BUDGET_MILLIS:3900}
payment.queue.retry-after-base-millis=${PAYMENT_QUEUE_RETRY_AFTER_BASE_MILLIS:100}
payment.queue.retry-after-max-millis=${PAYMENT_QUEUE_RETRY_AFTER_MAX_MILLIS:1000}
payment.provider-connect-timeout-millis=${PAYMENT_PROVIDER_CONNECT_TIMEOUT_MILLIS:250}
payment.provider-write-timeout-millis=${PAYMENT_PROVIDER_WRITE_TIMEOUT_MILLIS:250}
payment.provider-read-timeout-millis=${PAYMENT_PROVIDER_READ_TIMEOUT_MILLIS:10000}
payment.provider-temporary-error-retry-base-millis=${PAYMENT_PROVIDER_TEMPORARY_ERROR_RETRY_BASE_MILLIS:100}
payment.provider-temporary-error-retry-max-attempts=${PAYMENT_PROVIDER_TEMPORARY_ERROR_RETRY_MAX_ATTEMPTS:3}
